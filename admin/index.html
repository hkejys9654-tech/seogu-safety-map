<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="app-build" content="__BUILD__">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#284e68">
  <meta name="description" content="광주 서구 마을안전지도 시민참여단 의견 관리자 웹앱">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>서구 마을안전지도 관리자</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png?v=20260721-1">
  <link rel="apple-touch-icon" href="../assets/app-icon-192.png?v=20260721-1">
  <link rel="manifest" href="manifest.webmanifest?v=20260721-1">
  <link rel="preconnect" href="https://dapi.kakao.com">
  <link rel="stylesheet" href="../styles.css?v=20261015-3">
  <link rel="stylesheet" href="admin.css?v=20261015-3">
  <script src="../runtime-config.js?v=20260918-1" defer></script>
  <script src="../kakao-map.js?v=20260918-1" defer></script>
  <script src="../map-data.js?v=20260721-5" defer></script>
  <script src="../landmarks-data.js?v=20260721-8" defer></script>
  <script src="../firebase-config.js?v=20260721-4" defer></script>
  <script src="../firebase-service.js?v=20261021-2" defer></script>
  <script src="admin-layout.js?v=20261015-3" defer></script>
  <script src="app.js?v=20261015-3" defer></script>
  <script src="../update-check.js?v=20261015-1" defer></script>
</head>
<body class="admin-body admin-console" data-admin-tab="map">
  <header class="app-header admin-header">
    <div class="brand">
      <img class="brand-icon" src="../assets/app-icon-192.png?v=20260721-1" alt="">
      <div>
        <strong>서구 마을안전지도</strong>
        <span>관리자</span>
      </div>
    </div>
    <nav class="admin-nav" aria-label="관리 메뉴">
      <a class="admin-nav-link is-active" href="./" aria-current="page">안전지도 관리</a>
      <a class="admin-nav-link" href="hamkke.html">함께가게 관리</a>
    </nav>
    <div class="admin-header-actions">
      <button type="button" id="export-csv" class="header-button">CSV 내려받기</button>
      <button type="button" id="print-admin" class="header-button">지도 인쇄</button>
    </div>
  </header>

  <main class="admin-main">
    <section id="admin-app" class="view" aria-labelledby="admin-title">
      <h1 id="admin-title" class="sr-only">마을안전지도 통합 관리</h1>

      <div class="admin-workspace">
        <div class="admin-map-col" data-admin-panel="map">
          <div class="map-shell admin-map-shell">
            <div id="admin-map" class="map" aria-label="관리자 종합 안전지도"></div>
            <label class="map-landmark-toggle">
              <input type="checkbox" id="admin-landmark-toggle" checked>
              <span>주요장소</span>
            </label>
            <div id="line-edit-instruction" class="map-instruction" hidden>지도에서 경로를 따라 점을 차례로 눌러주세요.</div>
            <button type="button" id="cancel-report-relocation" class="map-action-cancel" hidden>위치 변경 취소</button>

            <div class="admin-legend-wrap">
              <div id="admin-legend" class="map-legend compact admin-map-filters" aria-label="관리자 지도 범례 및 표시 필터" hidden>
                <button type="button" class="legend-item legend-filter all is-active" data-map-filter="all" aria-pressed="true"><i class="legend-all-swatch" aria-hidden="true">전체</i><span>전체 표시</span></button>
                <button type="button" class="legend-item legend-filter return is-active" data-map-filter="return" aria-pressed="true"><i class="legend-line-swatch" aria-hidden="true"></i><span>여성안심귀갓길</span></button>
                <button type="button" class="legend-item legend-filter alley is-active" data-map-filter="alley-line" aria-pressed="true"><i class="legend-line-swatch" aria-hidden="true"></i><span>여성안전골목(구간)</span></button>
                <button type="button" class="legend-item legend-filter alley-point is-active" data-map-filter="alley-point" aria-pressed="true"><i class="legend-alley-point-swatch" aria-hidden="true"></i><span>여성안전골목(지점)</span></button>
                <button type="button" class="legend-item legend-filter parcel is-active" data-map-filter="parcel" aria-pressed="true"><i class="legend-point-swatch" aria-hidden="true">☆</i><span>안심택배보관함</span></button>
                <button type="button" class="legend-item legend-filter vending is-active" data-map-filter="vending" aria-pressed="true"><i class="legend-point-swatch" aria-hidden="true">△</i><span>생리대 자판기</span></button>
                <button type="button" class="legend-item legend-filter report is-active" data-map-filter="report" aria-pressed="true"><i class="legend-point-swatch" aria-hidden="true">●</i><span>참여단 의견</span></button>
              </div>
              <button type="button" id="admin-legend-toggle" class="legend-toggle" aria-expanded="false" aria-controls="admin-legend">
                <span aria-hidden="true">≡</span> 범례·필터
              </button>
            </div>

            <div id="line-editor-panel" class="line-editor-panel admin-edit-card" hidden>
              <div class="selected-feature-title">
                <strong id="selected-feature-label">새 안전시설</strong>
                <span id="point-count">0개 점</span>
              </div>
              <div class="feature-fields">
                <label class="text-label" for="feature-name">
                  <span>시설 이름</span>
                  <input id="feature-name" type="text" maxlength="80" placeholder="예: 상무금호건강생활지원센터" required>
                </label>
                <label class="text-label" for="feature-location">
                  <span>위치 설명</span>
                  <input id="feature-location" type="text" maxlength="150" placeholder="예: ○○초교 주변 원룸촌">
                </label>
              </div>
              <p id="line-edit-help" class="line-edit-help">지도에서 위치를 확인한 뒤 수정 또는 저장하세요.</p>
              <div class="line-editor-actions">
                <button type="button" id="redraw-line" class="secondary-button">위치 다시 지정</button>
                <button type="button" id="undo-point" class="secondary-button" disabled>마지막 점 취소</button>
                <button type="button" id="cancel-line-edit" class="secondary-button">편집 취소</button>
                <button type="button" id="delete-line" class="danger-button">시설 삭제</button>
                <button type="button" id="save-line" class="primary-button">확인 후 저장</button>
              </div>
            </div>
          </div>
        </div>

        <aside class="admin-side" data-admin-panel="list" aria-label="조회·편집·의견 목록">
          <div id="admin-connection-notice" class="notice" role="status" hidden>
            <strong>자료 불러오는 중</strong>
            <span>시민참여단 의견을 확인하고 있습니다.</span>
          </div>

          <div class="stats admin-stats-row" aria-label="의견 처리 현황">
            <article><span>전체 의견</span><strong id="stat-total">0</strong></article>
            <article><span>검토 중</span><strong id="stat-reviewing">0</strong></article>
            <article><span>지도 반영</span><strong id="stat-reflected">0</strong></article>
          </div>

          <section class="admin-control-panel admin-side-card" aria-label="지도 조회 조건">
            <div class="admin-filters">
              <label class="select-label" for="admin-dong">
                <span>행정동</span>
                <select id="admin-dong"><option value="all">18개 동 전체</option></select>
              </label>
              <label class="select-label" for="admin-status">
                <span>처리 상태</span>
                <select id="admin-status">
                  <option value="all">전체 상태</option>
                  <option value="received">접수</option>
                  <option value="reviewing">검토 중</option>
                  <option value="reflected">지도 반영</option>
                  <option value="hold">보류</option>
                  <option value="deleted">삭제된 의견</option>
                </select>
              </label>
            </div>
          </section>

          <section class="line-editor admin-side-card" aria-labelledby="line-editor-title">
            <div class="line-editor-heading">
              <h2 id="line-editor-title">안전시설 편집</h2>
            </div>
            <div class="line-create-controls">
              <label class="select-label" for="feature-type">
                <span>추가할 시설 종류</span>
                <select id="feature-type">
                  <option value="return">여성안심귀갓길</option>
                  <option value="alley">여성안전골목</option>
                  <option value="parcel">안심택배보관함</option>
                  <option value="vending">비상생리대 자판기</option>
                </select>
              </label>
              <button type="button" id="start-add-line" class="primary-button">＋ 안전시설 추가</button>
            </div>
            <p class="line-editor-guide">행정동을 하나 고른 뒤 추가하세요. 기존 시설은 지도에서 누르면 수정할 수 있습니다.</p>
          </section>

          <section class="admin-list-panel" aria-labelledby="admin-list-title">
            <div class="section-title-row">
              <h2 id="admin-list-title">등록 의견</h2>
              <span id="admin-report-count" class="count-badge">0건</span>
            </div>
            <div id="admin-report-list" class="admin-report-list"></div>
          </section>
        </aside>
      </div>
    </section>
  </main>

  <nav class="bottom-tabs admin-bottom-tabs" role="tablist" aria-label="화면 선택">
    <button type="button" class="bottom-tab is-active" role="tab" data-admin-tab="map" aria-selected="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4Z"/><path d="M9 4v13M15 6.5v13"/></svg>
      <span>지도</span>
    </button>
    <button type="button" class="bottom-tab" role="tab" data-admin-tab="list" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span>의견·편집</span>
    </button>
    <a class="bottom-tab" href="hamkke.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16l-1.5-5h-13L4 10Z"/><path d="M5 10v9h14v-9"/><path d="M10 19v-5h4v5"/></svg>
      <span>함께가게</span>
    </a>
  </nav>

  <dialog id="admin-report-dialog" class="report-dialog">
    <form id="admin-report-form">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow">시민참여단 의견 관리</p>
          <h2>등록 의견 수정</h2>
        </div>
        <button type="button" id="close-report-edit" class="icon-button" aria-label="닫기">×</button>
      </div>
      <div class="admin-report-fields">
        <label class="select-label" for="edit-report-dong">
          <span>행정동</span>
          <select id="edit-report-dong" required></select>
        </label>
        <label class="select-label" for="edit-report-type">
          <span>취약 유형</span>
          <select id="edit-report-type" required>
            <option value="dark">어두워요</option>
            <option value="cctv">CCTV 부족</option>
            <option value="emergencyBell">비상벨 부족</option>
            <option value="surveillance">CCTV·비상벨 부족(기존 등록)</option>
            <option value="visibility">시야가 가려져요</option>
            <option value="walking">보행하기 위험해요</option>
            <option value="anxiety">혼자 걷기 불안해요</option>
            <option value="other">기타</option>
          </select>
        </label>
        <label class="select-label" for="edit-report-status">
          <span>처리 상태</span>
          <select id="edit-report-status" required>
            <option value="received">접수</option>
            <option value="reviewing">검토 중</option>
            <option value="reflected">지도 반영</option>
            <option value="hold">보류</option>
          </select>
        </label>
      </div>
      <label class="text-label" for="edit-report-note">
        <span>의견 내용</span>
        <textarea id="edit-report-note" maxlength="120" rows="4" required></textarea>
      </label>
      <div class="report-location-editor">
        <div><strong>등록 위치</strong><span id="edit-report-coordinates"></span></div>
        <button type="button" id="relocate-report" class="secondary-button">지도에서 위치 다시 지정</button>
      </div>
      <div class="dialog-actions">
        <button type="button" id="cancel-report-edit" class="secondary-button">취소</button>
        <button type="submit" class="primary-button">수정 내용 저장</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript>이 관리자 앱은 자바스크립트가 필요합니다.</noscript>
</body>
</html>
