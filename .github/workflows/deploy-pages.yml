name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        env:
          KAKAO_MAP_JAVASCRIPT_KEY: ${{ secrets.KAKAO_MAP_JAVASCRIPT_KEY }}
        shell: pwsh
        run: ./scripts/build-site.ps1

      - name: Check JavaScript and map adapter
        run: |
          node --check kakao-map.js
          node --check app.js
          node --check admin/app.js
          node tests/kakao-map-adapter.test.mjs
          node tests/kakao-map-fallback.test.mjs
          node tests/admin-no-login.test.mjs
          node tests/admin-map-filter.test.mjs
          node tests/firestore-auto-deploy.test.mjs
          node tests/local-http-smoke.test.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-firestore-rules:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/681010600408/locations/global/workloadIdentityPools/github-actions/providers/seogu-safety-map
          service_account: github-firestore-deployer@seogu-safety-map.iam.gserviceaccount.com

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.30.1

      - name: Deploy Firestore security rules
        run: firebase deploy --only firestore:rules --project seogu-safety-map --non-interactive
